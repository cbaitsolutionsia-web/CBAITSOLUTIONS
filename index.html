<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBA IT SOLUTIONS | Consultoría y Soporte IT para PyMEs</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --primary: #0066cc;
            --primary-dark: #0a192f;
            --secondary: #00b4d8;
            --bg-light: #f8f9fa;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background-color: var(--white);
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        header {
            background-color: var(--primary-dark);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: var(--white);
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--secondary);
        }

        .hero {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #112240 100%);
            color: var(--white);
            padding: 100px 0 120px 0;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--white);
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--secondary);
            font-weight: 500;
            margin-bottom: 24px;
        }

        .hero-description {
            max-width: 700px;
            margin: 0 auto 40px auto;
            color: #a8b2d1;
            font-size: 1.1rem;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            font-size: 1rem;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: #0052a3;
            transform: translateY(-2px);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--white);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .btn-outline:hover {
            border-color: var(--secondary);
            color: var(--secondary);
            transform: translateY(-2px);
        }

        section {
            padding: 80px 0;
        }

        .section-bg {
            background-color: var(--bg-light);
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--primary-dark);
        }

        .section-desc {
            text-align: center;
            max-width: 600px;
            margin: 0 auto 50px auto;
            color: var(--text-muted);
        }

        .grid-problems {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card-problem {
            background-color: var(--danger-bg);
            border-left: 4px solid var(--danger);
            padding: 20px;
            border-radius: 0 8px 8px 0;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .card-problem i {
            color: var(--danger);
            margin-top: 4px;
        }

        .card-problem p {
            font-weight: 500;
            color: #991b1b;
        }

        .problems-footer {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary);
            margin-top: 30px;
        }

        .grid-services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .card-service {
            background-color: var(--white);
            padding: 30px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid rgba(0,0,0,0.03);
        }

        .card-service:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .service-icon {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .card-service h3 {
            font-size: 1.25rem;
            margin-bottom: 16px;
            color: var(--primary-dark);
        }

        .service-list {
            list-style: none;
        }

        .service-list li {
            margin-bottom: 10px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .service-list li i {
            color: var(--secondary);
            font-size: 0.8rem;
        }

        .grid-modalities {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .card-modality {
            background-color: var(--white);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .modality-badge {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin: 0 auto 16px auto;
        }

        .badge-puntual { background-color: #22c55e; }
        .badge-mensual { background-color: #3b82f6; }
        .badge-proyecto { background-color: #a855f7; }

        .card-modality h3 {
            margin-bottom: 12px;
            color: var(--primary-dark);
        }

        .card-modality p {
            color: var(--text-muted);
        }

        .experience-box {
            background-color: var(--primary-dark);
            color: var(--white);
            padding: 40px;
            border-radius: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        .experience-years {
            font-size: 3rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .experience-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        .tag {
            background-color: rgba(255,255,255,0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .experience-phrase {
            font-style: italic;
            border-left: 3px solid var(--secondary);
            padding-left: 15px;
            margin-top: 25px;
            color: #e2e8f0;
        }

        .steps {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .step {
            flex: 1;
            min-width: 180px;
            text-align: center;
            position: relative;
        }

        .step-num {
            width: 50px;
            height: 50px;
            background-color: var(--primary);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            margin: 0 auto 16px auto;
        }

        .step h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--primary-dark);
        }

        .step p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .about-phrase {
            text-align: center;
            max-width: 700px;
            margin: 40px auto 0 auto;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-dark);
            line-height: 1.4;
        }

        .contact-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 50px;
            margin-top: 30px;
        }

        .contact-info h3 {
            margin-bottom: 20px;
            color: var(--primary-dark);
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
